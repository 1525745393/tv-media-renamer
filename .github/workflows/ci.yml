name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖（PyQt5 offscreen 渲染）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: 安装 Python 依赖
        working-directory: 电影电视剧重命名单文件版
        run: pip install -r main/requirements.txt

      - name: 全功能测试
        working-directory: 电影电视剧重命名单文件版
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tests/test_all_features.py

      - name: 核心引擎测试
        working-directory: 电影电视剧重命名单文件版
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: python3 tests/test_media_renamer.py
