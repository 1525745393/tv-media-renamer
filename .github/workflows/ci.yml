name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================
  # Python 桌面版 + API 服务测试
  # ===========================================================
  python-test:
    name: Python 桌面版 & API 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            电影电视剧重命名单文件版/main/requirements.txt
            电影电视剧重命名单文件版/requirements-dev.txt

      - name: 安装系统依赖（PyQt5 offscreen 渲染）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: 安装 Python 依赖
        working-directory: 电影电视剧重命名单文件版
        run: |
          pip install -r main/requirements.txt
          pip install -r requirements-dev.txt
          pip install -r server/requirements.txt

      - name: 编译检查（全量字节码编译）
        working-directory: 电影电视剧重命名单文件版
        run: python3 -m compileall -q core ui modules main scripts/check_release.py server/app.py

      - name: Lint（ruff：未使用导入/语法错误类）
        working-directory: 电影电视剧重命名单文件版
        run: ruff check core/ ui/ modules/ main/ scripts/check_release.py server/app.py --select F,E9

      - name: 类型检查（mypy：新代码渐进式）
        working-directory: 电影电视剧重命名单文件版
        run: mypy core/version.py scripts/check_release.py --ignore-missing-imports --follow-imports=skip

      - name: 导入冒烟（关键模块 + GUI 启动）
        working-directory: 电影电视剧重命名单文件版
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -c "from core.version import VERSION; assert VERSION"
          python3 -c "from core.pattern_recognizer import PatternRecognizer; PatternRecognizer()"
          python3 -c "from core.update_checker import UpdateChecker; UpdateChecker('0.0.1').check_async()"
          python3 -c "import sys; from PyQt5.QtWidgets import QApplication; a = QApplication(sys.argv); from ui.main_window import RenameUI; w = RenameUI(); assert w.windowTitle()"

      - name: 全功能测试
        working-directory: 电影电视剧重命名单文件版
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tests/test_all_features.py

      - name: 核心引擎测试（含解析参数化用例）
        working-directory: 电影电视剧重命名单文件版
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 tests/test_media_renamer.py
          python3 tests/test_pattern_recognizer.py
          python3 tests/test_remote_client.py

      - name: API 服务冒烟（鉴权 + 健康检查）
        working-directory: 电影电视剧重命名单文件版
        run: |
          API_TOKEN=ci-token PORT=8131 python3 server/app.py > /tmp/api.log 2>&1 &
          API_PID=$!
          sleep 4
          curl -s -o /dev/null -w "无token=%{http_code} " http://127.0.0.1:8131/api/health
          curl -s -o /dev/null -w "带token=%{http_code}\n" -H "Authorization: Bearer ci-token" http://127.0.0.1:8131/api/health
          curl -s -H "Authorization: Bearer ci-token" http://127.0.0.1:8131/api/analyze?filename=Game.of.Thrones.S08E03.mkv | grep -q '"type":"tv"'
          echo "解析 API 正常"
          kill $API_PID

      - name: 版本与 Changelog 校验
        working-directory: 电影电视剧重命名单文件版
        run: python3 scripts/check_release.py

  # ===========================================================
  # Flutter 移动端验证（借鉴 EmbyTok-Flutter ci.yml）
  # 分析只以 error 级别阻断；构建 debug APK 验证 Android 链路
  # ===========================================================
  flutter-test:
    name: Flutter 移动端分析 & 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.44.8"
          cache: true

      - name: 安装依赖
        run: flutter pub get
        working-directory: mobile

      - name: 代码分析（只以 error 阻断）
        working-directory: mobile
        run: |
          set +e
          flutter analyze --no-pub > /tmp/analyze.txt 2>&1
          set -e
          ERROR_COUNT=$(grep -c "^   error •" /tmp/analyze.txt || true)
          echo "📊 error: $ERROR_COUNT, warning: $(grep -c '^   warning •' /tmp/analyze.txt || true), info: $(grep -c '^   info •' /tmp/analyze.txt || true)"
          if [ "$ERROR_COUNT" -gt 0 ]; then
            echo "❌ 发现 error 级别问题："
            grep "^   error •" /tmp/analyze.txt
            exit 1
          fi
          echo "✅ 无 error 级别问题"

      - name: 运行单元测试（无测试文件则跳过）
        working-directory: mobile
        run: |
          if [ -d test ] && ls test/*.dart >/dev/null 2>&1; then
            flutter test
          else
            echo "ℹ️  暂无测试文件，跳过 flutter test"
          fi

      - name: 构建 Debug APK（验证 Android 构建链路）
        working-directory: mobile
        run: flutter build apk --debug

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-debug-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

  # ===========================================================
  # Docker 镜像构建验证（借鉴 EmbyTok ci.yml docker-build）
  # ===========================================================
  docker-build:
    name: Docker 镜像构建验证
    runs-on: ubuntu-latest
    needs: [python-test]
    steps:
      - uses: actions/checkout@v4

      - name: 构建 NAS API 服务镜像
        run: docker build -f 电影电视剧重命名单文件版/server/Dockerfile -t tv-renamer-api:ci-test 电影电视剧重命名单文件版/

      - name: 验证镜像存在
        run: docker images tv-renamer-api:ci-test
