name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            电影电视剧重命名单文件版/main/requirements.txt
            电影电视剧重命名单文件版/requirements-dev.txt

      - name: 安装系统依赖（PyQt5 offscreen 渲染）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: 安装 Python 依赖
        working-directory: 电影电视剧重命名单文件版
        run: |
          pip install -r main/requirements.txt
          pip install -r requirements-dev.txt

      - name: 编译检查（全量字节码编译）
        working-directory: 电影电视剧重命名单文件版
        run: python3 -m compileall -q core ui modules main scripts/check_release.py server/app.py

      - name: Lint（ruff：未使用导入/语法错误类）
        working-directory: 电影电视剧重命名单文件版
        run: ruff check core/ ui/ modules/ main/ scripts/check_release.py server/app.py --select F,E9

      - name: 类型检查（mypy：新代码渐进式）
        working-directory: 电影电视剧重命名单文件版
        run: mypy core/version.py scripts/check_release.py --ignore-missing-imports --follow-imports=skip

      - name: 导入冒烟（关键模块 + GUI 启动）
        working-directory: 电影电视剧重命名单文件版
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 -c "from core.version import VERSION; assert VERSION"
          python3 -c "from core.pattern_recognizer import PatternRecognizer; PatternRecognizer()"
          python3 -c "from core.update_checker import UpdateChecker; UpdateChecker('0.0.1').check_async()"
          python3 -c "import sys; from PyQt5.QtWidgets import QApplication; a = QApplication(sys.argv); from ui.main_window import RenameUI; w = RenameUI(); assert w.windowTitle()"

      - name: 全功能测试
        working-directory: 电影电视剧重命名单文件版
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tests/test_all_features.py

      - name: 核心引擎测试（含解析参数化用例）
        working-directory: 电影电视剧重命名单文件版
        env:
          PYTHONPATH: .
          QT_QPA_PLATFORM: offscreen
        run: |
          python3 tests/test_media_renamer.py
          python3 tests/test_pattern_recognizer.py

      - name: API 服务冒烟（鉴权 + 健康检查）
        working-directory: 电影电视剧重命名单文件版
        run: |
          API_TOKEN=ci-token PORT=8131 python3 server/app.py > /tmp/api.log 2>&1 &
          API_PID=$!
          sleep 4
          curl -s -o /dev/null -w "无token=%{http_code} " http://127.0.0.1:8131/api/health
          curl -s -o /dev/null -w "带token=%{http_code}\n" -H "Authorization: Bearer ci-token" http://127.0.0.1:8131/api/health
          curl -s -H "Authorization: Bearer ci-token" http://127.0.0.1:8131/api/analyze?filename=Game.of.Thrones.S08E03.mkv | grep -q '"type":"tv"'
          echo "解析 API 正常"
          kill $API_PID

      - name: 版本与 Changelog 校验
        working-directory: 电影电视剧重命名单文件版
        run: python3 scripts/check_release.py
