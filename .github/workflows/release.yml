name: Release

# 推送版本标签（v*）时自动：验证 → 构建（Linux + Windows）→ 发布 GitHub Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verify:
    name: 发布前验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖（PyQt5 offscreen）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: 安装依赖
        working-directory: 电影电视剧重命名单文件版
        run: |
          pip install -r main/requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        working-directory: 电影电视剧重命名单文件版
        run: ruff check core/ ui/ modules/ main/ scripts/check_release.py --select F,E9

      - name: 类型检查
        working-directory: 电影电视剧重命名单文件版
        run: mypy core/version.py scripts/check_release.py --ignore-missing-imports --follow-imports=skip

      - name: 全功能测试
        working-directory: 电影电视剧重命名单文件版
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 tests/test_all_features.py

      - name: 发布模式校验（版本一致性 + Changelog）
        working-directory: 电影电视剧重命名单文件版
        run: python3 scripts/check_release.py --release --run-tests

  build-linux:
    name: 构建 Linux 版
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装系统依赖（PyQt5 运行库）
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3

      - name: 安装依赖并打包
        working-directory: 电影电视剧重命名单文件版
        run: |
          pip install -r main/requirements.txt pyinstaller
          pyinstaller --noconfirm --log-level WARN --onedir --windowed \
            --name tv-media-renamer-linux \
            --paths . \
            --exclude-module guessit --exclude-module rebulk \
            main/tv_rename_gui_v1.3.py

      - name: 压缩产物
        working-directory: 电影电视剧重命名单文件版
        run: tar -czf tv-media-renamer-linux.tar.gz -C dist tv-media-renamer-linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: 电影电视剧重命名单文件版/tv-media-renamer-linux.tar.gz

  build-windows:
    name: 构建 Windows 版
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖并打包
        working-directory: 电影电视剧重命名单文件版
        run: |
          pip install -r main/requirements.txt pyinstaller
          pyinstaller --noconfirm --log-level WARN --onedir --windowed `
            --name tv-media-renamer-windows `
            --paths . `
            --exclude-module guessit --exclude-module rebulk `
            main/tv_rename_gui_v1.3.py

      - name: 压缩产物
        working-directory: 电影电视剧重命名单文件版
        shell: pwsh
        run: Compress-Archive -Path dist/tv-media-renamer-windows -DestinationPath tv-media-renamer-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: 电影电视剧重命名单文件版/tv-media-renamer-windows.zip

  release:
    name: 发布 Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 生成 Release 说明（从 CHANGELOG 提取）
        run: |
          python3 - <<'EOF'
          import re
          text = open('CHANGELOG.md', encoding='utf-8').read()
          # 找第一个正式版本块（[x.y.z] - 日期）
          m = re.search(r'^## \[([\d.]+)\] - (.+)$', text, re.M)
          if not m:
              print(f"请更新 CHANGELOG.md 后再发布（未找到正式版本块）", file=open('release_notes.txt', 'w'))
              raise SystemExit(1)
          ver, date = m.group(1), m.group(2)
          end = text.find('\n## [', m.end())
          body = text[m.end():end if end != -1 else len(text)].strip()
          notes = f"## 影视文件智能重命名工具 {ver}（{date}）\n\n{body}"
          open('release_notes.txt', 'w', encoding='utf-8').write(notes)
          print(f"已生成 {ver} 的 Release 说明")
          EOF

      - name: 创建 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "影视文件智能重命名工具 ${{ github.ref_name }}" \
            --notes-file release_notes.txt \
            artifacts/linux-build/tv-media-renamer-linux.tar.gz \
            artifacts/windows-build/tv-media-renamer-windows.zip
