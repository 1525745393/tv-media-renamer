# ===========================================================
# Secrets 配置检查工作流（借鉴 EmbyTok-Flutter secrets-check.yml）
#
# 手动触发（workflow_dispatch），验证发布所需的 GitHub Secrets
# 是否已配置。Docker 发布使用 GHCR（内置 GITHUB_TOKEN），
# 因此无需任何 Docker Secrets。
# ===========================================================

name: Secrets 配置检查

on:
  workflow_dispatch:
    inputs:
      verbose:
        description: '显示详细检查信息'
        required: false
        default: false
        type: boolean

jobs:
  # ===========================================================
  # Android 签名 Secrets 检查
  # ===========================================================
  android-secrets-check:
    name: 检查 Android 签名 Secrets
    runs-on: ubuntu-latest
    steps:
      - name: 检查 Android Secrets 配置
        id: check
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "检查 Android 签名配置"
          echo "========================================"
          echo ""

          android_secrets=()
          all_passed=true

          # ANDROID_KEYSTORE（可选：不配置时自动回退 debug 签名）
          if [ -n "${{ secrets.ANDROID_KEYSTORE }}" ]; then
            echo "✅ ANDROID_KEYSTORE 已配置"
            android_secrets+=("| ANDROID_KEYSTORE | keystore 文件 base64 | ✅ 已配置 |")
          else
            echo "ℹ️  ANDROID_KEYSTORE 未配置（回退 debug 签名构建）"
            android_secrets+=("| ANDROID_KEYSTORE | keystore 文件 base64 | ℹ️ 未配置（debug 回退） |")
          fi

          # ANDROID_KEYSTORE_PWD（仅在 keystore 配置时必需）
          if [ -n "${{ secrets.ANDROID_KEYSTORE_PWD }}" ]; then
            echo "✅ ANDROID_KEYSTORE_PWD 已配置"
            android_secrets+=("| ANDROID_KEYSTORE_PWD | keystore 密码 | ✅ 已配置 |")
          else
            echo "ℹ️  ANDROID_KEYSTORE_PWD 未配置（回退 debug 签名构建）"
            android_secrets+=("| ANDROID_KEYSTORE_PWD | keystore 密码 | ℹ️ 未配置（debug 回退） |")
          fi

          # ANDROID_KEY_ALIAS
          if [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ]; then
            echo "✅ ANDROID_KEY_ALIAS 已配置"
            android_secrets+=("| ANDROID_KEY_ALIAS | key 别名 | ✅ 已配置 |")
          else
            echo "ℹ️  ANDROID_KEY_ALIAS 未配置（回退 debug 签名构建）"
            android_secrets+=("| ANDROID_KEY_ALIAS | key 别名 | ℹ️ 未配置（debug 回退） |")
          fi

          # ANDROID_KEY_PWD
          if [ -n "${{ secrets.ANDROID_KEY_PWD }}" ]; then
            echo "✅ ANDROID_KEY_PWD 已配置"
            android_secrets+=("| ANDROID_KEY_PWD | key 密码 | ✅ 已配置 |")
          else
            echo "ℹ️  ANDROID_KEY_PWD 未配置（回退 debug 签名构建）"
            android_secrets+=("| ANDROID_KEY_PWD | key 密码 | ℹ️ 未配置（debug 回退） |")
          fi

          # 判定：4 项全部配置才算签名就绪
          if [ -n "${{ secrets.ANDROID_KEYSTORE }}" ] && \
             [ -n "${{ secrets.ANDROID_KEYSTORE_PWD }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && \
             [ -n "${{ secrets.ANDROID_KEY_PWD }}" ]; then
            echo ""
            echo "✅ Android 签名 Secrets 全部配置完成（release 签名就绪）"
            state="✅ **状态：release 签名就绪**"
          else
            echo ""
            echo "ℹ️  Android 签名 Secrets 不完整：Android Release 将回退 debug 签名"
            echo "   如需正式签名发布，请在 Settings → Secrets and variables → Actions 配置缺失项。"
            state="ℹ️ **状态：debug 签名回退**"
          fi

          # 输出到 GitHub Step Summary
          {
            echo "## Android Secrets 配置检查结果"
            echo ""
            echo "| Secret 名称 | 用途 | 状态 |"
            echo "|------------|------|------|"
            for row in "${android_secrets[@]}"; do
              echo "${row}"
            done
            echo ""
            echo "${state}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================
  # Docker 发布检查（GHCR 无需额外 Secrets）
  # ===========================================================
  docker-release-check:
    name: 检查 Docker 发布配置
    runs-on: ubuntu-latest
    steps:
      - name: 检查 GHCR 配置
        shell: bash
        run: |
          {
            echo "## Docker 发布配置检查结果"
            echo ""
            echo "| 项目 | 说明 | 状态 |"
            echo "|------|------|------|"
            echo "| 镜像仓库 | GitHub Container Registry (GHCR) | ✅ 内置 GITHUB_TOKEN，无需配置 |"
            echo "| 多架构 | linux/amd64 + linux/arm64 | ✅ Buildx 自动处理 |"
            echo "| 包可见性 | 首次推送后需手动设为 Public | ⚠️ 见下方指引 |"
            echo ""
            echo "推送 tag 后到 [Packages](https://github.com/settings/packages) 将"
            echo "\`tv-renamer-server\` 包设为 **Public**，群晖才能免登录拉取镜像。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================
  # 汇总报告
  # ===========================================================
  summary:
    name: 配置汇总
    runs-on: ubuntu-latest
    needs: [android-secrets-check, docker-release-check]
    steps:
      - name: 生成汇总报告
        shell: bash
        run: |
          {
            echo "## Secrets 配置检查汇总"
            echo ""
            echo "✅ **检查完成！** 请查看上方各步骤的详细结果。"
            echo ""
            echo "### 快速链接"
            echo "- [查看检查详情](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- [GitHub Secrets 设置页面](https://github.com/${{ github.repository }}/settings/secrets/actions)"
            echo "- [GHCR Packages 设置页面](https://github.com/settings/packages)"
            echo ""
            echo "### 下一步"
            echo "1. （可选）配置 Android 签名 Secrets 以正式签名发布"
            echo "2. 测试发布：\`git tag v1.3.0 && git push --tags\`"
            echo "   - Android Release：构建 APK（签名或 debug）"
            echo "   - Docker Release：推送多架构镜像到 GHCR"
          } >> "$GITHUB_STEP_SUMMARY"
